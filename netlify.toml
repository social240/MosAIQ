# RavMizAI — Netlify deployment
#
# assets/supabase-config.js is gitignored (it holds project credentials), so it
# is not in the repo. The build command regenerates it from the environment
# variables set in the Netlify dashboard.
#
# Required in Netlify → Site configuration → Environment variables:
#   SUPABASE_URL       https://ujqrmjoklinyxbnvyswa.supabase.co
#   SUPABASE_ANON_KEY  the "anon public" key (never service_role)
#
# Do NOT add SUPABASE_DB_PASSWORD or SUPABASE_ACCESS_TOKEN — the site does not
# use them and they must not reach a build that produces browser files.

[build]
  # After writing the config, drop repo-only material from the deploy: the SQL,
  # the Edge Function sources, the test suite, the GitHub workflows and the
  # Markdown notes (README, DEPLOY, STRIPE, EOD reports). The whole repo folder
  # is published, so without this they are served to anyone who guesses the
  # address.
  command = "node build-config.js && rm -rf sql supabase tests .github ./*.md"
  publish = "."

# Clean URLs: /about instead of /about.html
[build.processing.html]
  pretty_urls = true

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
# Content-Security-Policy: scripts only from this site, Google sign-in and the
# Delphi chat embed -- no inline scripts anywhere (index.html's moved to
# assets/home-media.js; supabase-js is served from assets/vendor/, pinned).
# Data goes only to our Supabase project and Google sign-in; frames only to
# Google sign-in and Delphi. Inline styles stay allowed (the pages use style
# attributes). Every page was loaded under this policy with no violations,
# including the Delphi chat as a member. Adding a new third-party script,
# embed or API means adding its host here, or the browser will block it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://www.delphi.ai; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://ujqrmjoklinyxbnvyswa.supabase.co wss://ujqrmjoklinyxbnvyswa.supabase.co https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ https://www.delphi.ai https://delphi.ai; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# The generated config carries the public anon key. It is safe to serve, but it
# must never be cached by a CDN edge after the key is rotated.
[[headers]]
  for = "/assets/supabase-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# app.js / auth.js / styles.css change with each deploy and have no hashed
# filenames, so they must revalidate rather than sit in a long cache.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# One address: the old Netlify address forwards to the custom domain
# ---------------------------------------------------------------------------
# ravmizai.com is the primary domain (GoDaddy DNS -> Netlify, since
# 2026-11-13). Old links, bookmarks and emails that use ravmizaii.netlify.app
# land on the same page there, path and query kept. Deploy previews use other
# netlify.app hostnames, so they are not affected.
[[redirects]]
  from = "https://ravmizaii.netlify.app/*"
  to = "https://ravmizai.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Keep server-side material out of the published site
# ---------------------------------------------------------------------------
# The SQL, Edge Function sources and tests live in the repo but are not part
# of the site. Serving them would expose the schema and the trial-granting
# logic. force = true is required: without it Netlify serves any file that
# exists at the path and skips the rule. The build command also deletes these
# folders; the rules cover deploys that skip the build (drag and drop).
[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

# Belt and braces. .env must never be in the deploy at all — it holds the
# database password and the Supabase access token, which grant full control of
# the project. This blocks it from being served even if it reaches the bundle
# (a drag-and-drop deploy of the folder would include it, since that path
# ignores .gitignore).
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-config.js"
  to = "/404.html"
  status = 404
  force = true
